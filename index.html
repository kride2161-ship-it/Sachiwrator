                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function showToast(message){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          toast.textContent=message;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            toast.classList.add("show");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              clearTimeout(showToast.timer);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showToast.timer=setTimeout(()=>toast.classList.remove("show"),2300);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function setResult(value,blocked=false){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  result.textContent=value||"Здесь появится результат...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    result.classList.toggle("empty",!value);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      result.classList.toggle("blocked",blocked);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        lastOutput=value||"";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          outputAvailable=!!value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function createNotice(type,title,message,action=null){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const card=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              card.className="notice "+type;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const icon=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  icon.className="notice-icon";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    icon.textContent=type==="warning"?"!":"✓";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const content=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        content.className="notice-content";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const heading=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            heading.className="notice-title";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              heading.textContent=title;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const description=document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  description.className="notice-message";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    description.textContent=message;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const close=document.createElement("button");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        close.className="notice-close";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          close.textContent="×";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            close.setAttribute("aria-label","Закрыть");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              close.addEventListener("click",event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  event.stopPropagation();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      removeNotice(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          content.append(heading,description);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.append(icon,content,close);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(action)card.addEventListener("click",action);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                noticeStack.appendChild(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  enableSwipe(card);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return card;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function removeNotice(card){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(!card||!card.isConnected)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        card.classList.add("removing");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          setTimeout(()=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              card.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(card.dataset.warning==="true")warningVisible=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    },300);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function showProfanityWarning(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(matMode||warningVisible)return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        warningVisible=true;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const card=createNotice(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "warning",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Toosh",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "Извините, наш AI (ИИ) алгоритм посчитал этот текст текстом с матом."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          card.dataset.warning="true";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.addEventListener("click",event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(event.target.closest(".notice-close"))return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    secretTapCount++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(secretTapCount>=5){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              secretTapCount=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    activateMatMode();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function activateMatMode(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            matMode=true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              [...noticeStack.querySelectorAll(".notice")].forEach(removeNotice);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                warningVisible=false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  createNotice(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "success",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "Режим активирован",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              "Настройки обработки текста обновлены.",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  event=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(event.target.closest(".notice-close"))return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              matMode=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    [...noticeStack.querySelectorAll(".notice")].forEach(removeNotice);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          warningVisible=false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                showToast("Режим отключён");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function enableSwipe(card){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let startY=0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          card.addEventListener("touchstart",e=>{startY=e.touches[0].clientY},{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            card.addEventListener("touchend",e=>{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const endY=e.changedTouches[0].clientY;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if(startY-endY>45){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const cards=[...noticeStack.querySelectorAll(".notice")];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(cards.length>1)noticeStack.appendChild(cards[0]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      },{passive:true});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /* Основная обработка */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function processText(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const text=source.value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(!text.trim()){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setResult("");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  showToast("Сначала введи текст");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          // Мат блокирует шифрование, пока секретный режим выключен.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(operation==="encrypt"&&containsProfanity(text)&&!matMode){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                setResult("",true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    showProfanityWarning();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        showToast("Шифрование недоступно");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                try{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let output="";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(currentMode==="morse"){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              output=operation==="encrypt"?encodeMorse(text):decodeMorse(text);
